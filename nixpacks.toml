# Installs fontconfig + DejaVu fonts during the Railway build so `sharp`
# (via librsvg) can actually render text in the roster calendar image
# (backend/utils/rosterImage.js). Without this, Railway's bare Nixpacks
# container has no fonts at all, and SVG <text> renders as empty
# missing-glyph boxes ("tofu") — happened on the first two live tests
# (4 Jul 2026) even though the code itself worked and threw no errors.
[phases.setup]
aptPkgs = ["fontconfig", "fonts-dejavu-core"]
